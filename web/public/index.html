<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- ★ 2026-10-19 移动端标签页适配：favicon 全套（SVG 矢量 + PNG 回退 + iOS 主屏图标）
     + PWA manifest + 双主题 theme-color（手机浏览器 UI 条跟站主题走，暗色为默认态）。
     路径全相对（站点可能挂在子路径下），en/ 页用 ../ 前缀（构建不改写，双份各写各的）。 -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#18191e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<!-- ★ 标题标签就是品牌词（2026-10-22 按 owner 要求去掉长描述）。 -->
<title>趋势大盘</title>
<meta name="description" content="趋势大盘：把各家平台的模型榜单、开源生态与 AI 资讯收进一个页面。">
<!--
  单页站：39 个榜单全部在这一页上铺开（按主题六类分段），没有二级页面。

  页面里刻意**没有** canonical / og:url / 站长验证这类标记：它们的地址必须是
  **绝对 URL**，而本站不写死域名（路径全用相对，见下）。GTM 与它们不同 ——
  容器 ID 与部署地址无关，所以它**有**，由构建期落下（见 `src/site/gtm.js`）。

  路径全部是**相对路径**（`site.css` 而不是 `/site.css`）：站点既可能挂在
  `https://<用户名>.github.io/<仓库>/` 下，也可能挂在自定义域名的根下，
  相对路径两种都能用，不需要任何 BASE_PATH 配置，也就不存在"换个域名整站白屏"。
  下面这行 base 标签把这些相对路径钉在**本文件所在目录**上，与访问地址怎么写无关
  （少了它，`/index.html` 与 `/index.html/` 这类地址会解析到不同的目录）。

  两个占位符由构建期落值（`src/site/nav.js`）：
    · 索引条占位（按主题分组的 39 个榜）
    · 主题分段占位（六个主题段的骨架，面板由 trend.js 挂进去）
  两者的真值都只在 `assets/boards.js`（面板/主题清单）与 `assets/i18n.js`（文案）。
  （这里刻意不写出占位符的字面量：注入是朴素的字符串替换，写在注释里也会被撑开。）
-->
<base href="./">
<!-- ★ 主题引导：必须在**样式表之前**、且是同步内联脚本（不是 module）。
     摆在样式表之后就会先按默认暗色画一帧再翻成亮色 ——"先白后黑"就是这么来的。
     正文由构建期落值（src/site/theme-boot.js → assets/theme.js 的 bootSnippet()），
     所以 localStorage 的键与"什么算合法值"只有一处真值。 -->
{{THEME_BOOT}}
<link rel="stylesheet" href="site.css">
<!-- 数据版本号（build-site 落值为最新快照 fetchedAt 的毫秒时间戳）：
     trend.js 给 assets/data/*.json 的站内引用拼 ?v= 穿透浏览器/CDN 缓存，
     数据不动版本不变，数据一更新 URL 必变。 -->
<script>window.__TREND_DATA_V__="{{DATA_V}}";</script>
<!-- Google Tag Manager：容器 ID 的唯一来源是 src/site/gtm.js，构建期落成真值。
     放在 head 靠前的位置（早于页面绘制开始上报），与 Google 的建议一致。 -->
{{GTM}}
</head>
<body>
<!-- GTM 的 noscript 回退，位置由 Google 规定：紧跟 <body> 开标签 -->
{{GTM_NOSCRIPT}}

<header class="site-header">
  <div class="wrap header-inner">
    {{SITE_NAV}}
  </div>
</header>

<main class="wrap">
  <!-- 页头左侧的 h1（nav.js 落）就是站点名；正文直接从分栏开始
       （2026-10-22 按 owner 要求删掉了标题下的描述行）。
       层次仍是三级：h1 站点名（在页头）/ h2 主题段 / h3 面板（trend.js 渲染）。 -->

  <!-- 左右分栏（2026-10-20）：左列是**固定的分类栏**（39 个榜按主题分组，
       点一个只看那一个；不做折叠、不跟随页面滚动），右列是正文（选中的榜 /
       未选中时的每日视图）。窄屏（<1024px）退回上下布局：分类栏回到页头下方
       那条可折叠的索引条（见 site.css 的断点）。 -->
  <div class="home-layout">
  {{BOARD_INDEX}}

  <div class="home-main">
  <!-- 每日视图（2026-10-19）：**未选中任何榜时的落点** —— 一句随机名言 +
       历史上的今天图文卡。默认选中「微博热搜」，所以它平时是隐藏的；
       把选中的那一片再点一次（取消选中）才会出现。
       内容由 trend.js 的 mountDaily() 填充，骨架在这里只为 SSR 形状与无 JS 兜底。 -->
  <section id="daily" class="daily" hidden>
    <div class="daily-quote">
      <h2 class="daily-h2" data-daily-quote-title></h2>
      <blockquote class="daily-quote-text" data-daily-quote></blockquote>
      <div class="daily-quote-meta"><span class="daily-quote-author" data-daily-author></span>
        <button class="daily-next" type="button" data-daily-next></button></div>
    </div>
    <div class="daily-history">
      <h2 class="daily-h2" data-daily-history-title></h2>
      <p class="daily-history-note" data-daily-note></p>
      <div class="daily-grid" data-daily-grid></div>
    </div>
  </section>

  <!-- 六个主题分段（模型榜 / 评测榜 / 社区生态 / 平台洞察 / 资讯 / 中文热榜）。
       每段里的面板由 trend.js 运行时建骨架并懒加载：滚到视口附近才去上游取数，
       否则进页面会同时开拉十几个源（其中三个是 4MB+ 的大体积榜）。 -->
  <div id="panels">
  {{BOARD_TOPICS}}
  </div>
  </div>
  </div>
</main>
<script src="assets/trend.js" type="module"></script>
<script src="assets/ui.js" type="module"></script>
<script src="assets/theme.js" type="module"></script>
</body>
</html>
