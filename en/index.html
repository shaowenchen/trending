     brand word + one-line site description. Same convention as the h1 and the
     meta description — hand-written per language, not in the dictionary and not
     a placeholder (the BRAND placeholder mechanism retired with this change: the brand
     word differs per language, one placeholder cannot produce both). -->
<title>Trend boards</title>
<meta name="description" content="Trend boards: model rankings, open-source ecosystem and AI news on one page.">
<!--
  Single-page site: all 39 boards live on this page, grouped into six topic
  sections. There are no second-level pages any more.

  Same notes as the Chinese page: hand-written static file served straight by
  GitHub Pages, relative paths only, `<base href="./">` pins them to this
  directory. There is deliberately no canonical / og:url / site verification
  here — those need an absolute URL and this site never hard-codes its domain.
  GTM is different: the container id does not depend on where the site is
  hosted, so it is here, resolved at build time (see `src/site/gtm.js`).

  Two build-time placeholders (see `src/site/nav.js`):
    - the sticky index bar (topic filter + board jumps + refresh)
    - the six topic sections; trend.js mounts the panels into them
  Both derive from `assets/boards.js` (board/topic list) and `assets/i18n.js` (text).
  (The placeholder literals are deliberately not spelled out here: injection is a
  plain string replace, so a mention inside a comment would be expanded too.)
-->
<base href="./">
<!-- ★ Theme boot: must run BEFORE the stylesheet, as a plain synchronous
     inline script (not a module). Place it after the stylesheet and the
     browser paints one frame in the default dark theme first — that flash is
     exactly why the toggle was removed in the first place. The body is
     resolved at build time (src/site/theme-boot.js → assets/theme.js
     bootSnippet()), so the localStorage key and the valid-value rule have a
     single source. -->
<script>try{var t=localStorage.getItem("trend-theme");if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="../site.css?v=1792870210">
<!-- Data version stamp (build-site fills in the newest snapshot fetchedAt in ms):
     trend.js appends ?v= to in-site assets/data/*.json URLs to bust browser/CDN
     caches. Unchanged data keeps the version; any update changes the URL. -->
<script>window.__TREND_DATA_V__="1792870219244";</script>
<!-- Google Tag Manager: container id comes from src/site/gtm.js, resolved at build time -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-MTW4XNQ');</script>

       quote + illustrated "on this day" cards. "Weibo hot search" is selected by

       Filled by mountDaily() in trend.js; this skeleton is just shape. -->
  <section id="daily" class="daily" hidden>

      <h2 class="daily-h2" data-daily-quote-title></h2>

       lazy-loads it: data is only fetched when a panel scrolls near the

       once (three of them 4MB+ boards). -->
